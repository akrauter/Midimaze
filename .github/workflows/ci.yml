name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOCKERHUB_IMAGE: akrauter/midimaze

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MidiMaze.slnx

      - name: Build
        run: dotnet build MidiMaze.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MidiMaze.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'

  docker-build:
    name: Docker image builds
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  version:
    name: Determine release version
    needs: build-and-test
    # Only ever release from master, regardless of which event triggered the run.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Determine version
        id: version
        run: |
          echo "version=$(date +'%Y.%m.%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

  docker:
    name: Build & push Docker image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:master-${{ needs.version.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-windows:
    name: Build & publish Windows release
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/MidiMaze.Server/MidiMaze.Server.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/MidiMaze

      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item deploy/windows/* publish/
          Compress-Archive -Path publish/MidiMaze, publish/Start-MidiMaze.bat, publish/Install-Service.ps1, publish/Uninstall-Service.ps1, publish/README.txt `
            -DestinationPath MidiMaze-win-x64-${{ needs.version.outputs.version }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: MidiMaze ${{ needs.version.outputs.version }}
          target_commitish: master
          make_latest: true
          generate_release_notes: true
          files: MidiMaze-win-x64-${{ needs.version.outputs.version }}.zip

  release-linux:
    name: Build & publish Linux release
    needs: [ version, release-windows ]
    # Built on ubuntu-latest (not cross-compiled from Windows) so `dotnet publish` sets the
    # executable bit on the apphost itself - a tarball assembled on NTFS has no Unix permission bits.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (linux-x64, self-contained)
        run: dotnet publish src/MidiMaze.Server/MidiMaze.Server.csproj --configuration Release --runtime linux-x64 --self-contained true --output publish/MidiMaze

      - name: Assemble package
        run: |
          cp deploy/linux/start-midimaze.sh deploy/linux/midimaze.service deploy/linux/README.txt publish/
          chmod +x publish/MidiMaze/MidiMaze.Server publish/start-midimaze.sh
          tar -czf MidiMaze-linux-x64-${{ needs.version.outputs.version }}.tar.gz -C publish MidiMaze start-midimaze.sh midimaze.service README.txt

      - name: Upload Linux release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: master
          files: MidiMaze-linux-x64-${{ needs.version.outputs.version }}.tar.gz
